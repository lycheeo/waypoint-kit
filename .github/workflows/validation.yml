name: Validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Show Swift version
        run: swift --version

      - name: Build
        run: swift build

      - name: Run validation suite
        run: swift run WaypointKitValidation
